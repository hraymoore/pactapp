<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password — Pact</title>
<meta name="description" content="Reset your Pact password.">
<link rel="canonical" href="https://www.pactappstore.com/forgot-password.html">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pact">
<meta property="og:title" content="Forgot Password — Pact">
<meta property="og:description" content="Reset your Pact password.">
<meta property="og:url" content="https://www.pactappstore.com/forgot-password.html">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0b0c0f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="mark">P</span> Pact</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="templates.html">Templates</a>
      <a href="pricing.html">Pricing</a>
      <a href="features.html">Security &amp; AI</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="nav-actions">
      <div data-auth="out" style="display:flex;gap:12px;">
        <a href="login.html" class="btn btn-ghost-dark btn-sm">Log In</a>
        <a href="signup.html" class="btn btn-gold btn-sm">Create Profile</a>
      </div>
      <div data-auth="in" style="display:none;align-items:center;gap:12px;">
        <span class="tier-pill" data-user-tier>Starter</span>
        <a href="dashboard.html" class="avatar" data-user-avatar>P</a>
      </div>
    </div>
    <button class="nav-toggle" aria-label="Menu">&#9776;</button>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <div class="eyebrow" style="justify-content:center;display:flex;">Account recovery</div>
    <h2 class="center">Reset your password</h2>
    <p class="center" style="font-size:0.9rem;">Enter your account email and we'll send a temporary password. It expires in 30 minutes.</p>

    <div id="formAlert" class="alert alert-ruby"></div>
    <div id="formSuccess" class="alert alert-emerald"></div>

    <form id="forgotForm">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" required placeholder="you@company.com">
      </div>
      <button type="submit" class="btn btn-gold btn-block" id="submitBtn">Send Temporary Password</button>
    </form>
    <p class="form-note"><a href="login.html">Back to log in</a></p>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const alertBox = document.getElementById("formAlert");
    const successBox = document.getElementById("formSuccess");
    const submitBtn = document.getElementById("submitBtn");
    alertBox.classList.remove("show");
    successBox.classList.remove("show");

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";
    try {
      const r = await fetch("/api/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ email }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "Something went wrong.");

      let msg = data.message;
      if (data.devNote) {
        msg += ` ${data.devNote}<strong style="font-family:var(--font-mono);">${data.tempPassword}</strong> (valid ${data.expiresInMinutes} minutes — this only shows because email isn't configured on this server yet).`;
      }
      successBox.innerHTML = msg;
      successBox.classList.add("show");
      document.getElementById("forgotForm").reset();
    } catch (err) {
      alertBox.textContent = err.message;
      alertBox.classList.add("show");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Send Temporary Password";
    }
  });
</script>
</body>
</html>
