<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In — Pact</title>
<meta name="description" content="Log in to your Pact profile.">
<link rel="canonical" href="https://www.pactappstore.com/login.html">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pact">
<meta property="og:title" content="Log In — Pact">
<meta property="og:description" content="Log in to your Pact profile.">
<meta property="og:url" content="https://www.pactappstore.com/login.html">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0b0c0f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="mark">P</span> Pact</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="templates.html">Templates</a>
      <a href="pricing.html">Pricing</a>
      <a href="features.html">Security &amp; AI</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="nav-actions">
      <div data-auth="out" style="display:flex;gap:12px;">
        <a href="login.html" class="btn btn-ghost-dark btn-sm">Log In</a>
        <a href="signup.html" class="btn btn-gold btn-sm">Create Profile</a>
      </div>
      <div data-auth="in" style="display:none;align-items:center;gap:12px;">
        <span class="tier-pill" data-user-tier>Starter</span>
        <a href="dashboard.html" class="avatar" data-user-avatar>P</a>
      </div>
    </div>
    <button class="nav-toggle" aria-label="Menu">&#9776;</button>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-card">
    <div class="eyebrow" style="justify-content:center;display:flex;">Welcome back</div>
    <h2 class="center">Log in to Pact</h2>
    <p class="center" style="font-size:0.9rem;">No profile isn't a dead end — <a href="signup.html" style="color:var(--gold-bright);">create one free</a> in under a minute.</p>

    <div id="formAlert" class="alert alert-ruby"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" required placeholder="you@company.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="Your password">
      </div>
      <button type="submit" class="btn btn-gold btn-block">Log In</button>
    </form>
    <p class="form-note">New to Pact? <a href="signup.html">Create your free profile</a></p>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const alertBox = document.getElementById("formAlert");
    const submitBtn = e.target.querySelector("button[type=submit]");

    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in…";
    try {
      await PactAPI.login({ email, password });
      const params = new URLSearchParams(window.location.search);
      window.location.href = params.get("next") || "dashboard.html";
    } catch (err) {
      alertBox.textContent = err.message;
      alertBox.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "Log In";
    }
  });
</script>
</body>
</html>
